# IntentGate's PR check (ADR 0005, pr-check.md): builds `intentgate` from this repository, runs
# `intentgate verify` and publishes the result as one check run, at most one comment and SARIF.
# Phase 0 is advisory: no step can fail the job (every step continues on error), and a step that
# cannot run is skipped, not failed.
#
# pull_request only (ADR 0005): every step is guarded by the event, and any other event, such as
# pull_request_target, gets one warning and nothing else.
#
# Values from the event reach the scripts only through `env:`; no ${{ }} appears inside a `run:`.
name: IntentGate
description: Check a pull request against the intent locks it adds, and publish the result.
inputs:
  go-version:
    description: Go version used to build intentgate (the go-version input of actions/setup-go).
    default: stable
  token:
    description: Token for the Checks and Issues APIs. A pull request from a fork gets a read-only one; see README.
    default: ${{ github.token }}
  bot-login:
    description: Login whose comments are the Action's own, found by their marker and edited in place. Set it when `token` is a personal access token or another App's token.
    default: github-actions[bot]
outputs:
  exit-code:
    description: Exit code of `intentgate verify` (0 clean, 1 findings, 3 could not decide). It never fails the job.
    value: ${{ steps.verify.outputs.exit_code }}
runs:
  using: composite
  steps:
    - id: other-event
      if: github.event_name != 'pull_request'
      continue-on-error: true
      shell: bash
      run: echo "::warning title=IntentGate::IntentGate supports pull_request only. This event is ignored; pull_request_target is not supported."

    # actions/setup-go v6.5.0
    - id: go
      if: github.event_name == 'pull_request'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      continue-on-error: true
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - id: build
      if: github.event_name == 'pull_request' && steps.go.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSION: ${{ github.action_ref || github.sha }}
        GOWORK: "off"
      run: |
        mkdir -p "$RUNNER_TEMP/intentgate-bin"
        cd "$ACTION_PATH/.." || exit 1
        go build -trimpath -ldflags "-X main.version=$VERSION" -o "$RUNNER_TEMP/intentgate-bin/intentgate" ./cmd/intentgate

    - id: verify
      if: github.event_name == 'pull_request' && steps.build.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        out="$RUNNER_TEMP/intentgate"
        rm -rf "$out"
        if "$RUNNER_TEMP/intentgate-bin/intentgate" verify --base "$BASE_SHA" --head "$HEAD_SHA" --base-branch "$BASE_REF" --author "$AUTHOR" --author-type "$AUTHOR_TYPE" --out-dir "$RUNNER_TEMP/intentgate" --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"; then
          code=0
        else
          code=$?
        fi
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$out/results.sarif" ] && [ -f "$out/decision.json" ] && grep -Eq '"publish":[[:space:]]*true' "$out/decision.json"; then
          echo "upload=true" >> "$GITHUB_OUTPUT"
        else
          echo "upload=false" >> "$GITHUB_OUTPUT"
        fi

    # The result is in the job summary on every run, including a fork pull request whose token
    # cannot write a check run or a comment. A step's summary is bounded to 1 MiB.
    - id: summary
      if: github.event_name == 'pull_request' && steps.verify.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/intentgate/summary.md" ]; then
          head -c 1000000 "$RUNNER_TEMP/intentgate/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - id: publish
      if: github.event_name == 'pull_request' && steps.verify.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if ! "$RUNNER_TEMP/intentgate-bin/intentgate" publish --out-dir "$RUNNER_TEMP/intentgate" --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --bot-login "$BOT_LOGIN"; then
          echo "::warning title=IntentGate::The result could not be published. A pull request from a fork gets a read-only token, so it cannot write a check run or a comment."
        fi

    # github/codeql-action v4.39.3
    - id: upload
      if: github.event_name == 'pull_request' && steps.verify.outputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
      continue-on-error: true
      with:
        sarif_file: ${{ runner.temp }}/intentgate/results.sarif
        category: intentgate

    # actions/upload-artifact v7.0.2
    - id: artifact
      if: github.event_name == 'pull_request' && steps.verify.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      continue-on-error: true
      with:
        name: intentgate
        path: ${{ runner.temp }}/intentgate
        if-no-files-found: ignore

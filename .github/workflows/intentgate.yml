name: IntentGate

on:
  pull_request:

concurrency:
  group: intentgate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  intentgate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dogfood: the Action built from this pull request's checkout. Safe under pull_request, where
      # the token is read-only for forks and the Action refuses every other event.
      - uses: ./action

name: Mill Merge Sync

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  MILL_REF: 68e5a54

jobs:
  mark_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check advisory mill config
        id: mill_env
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          MILL_URL: ${{ secrets.MILL_URL }}
          MILL_API_TOKEN: ${{ secrets.MILL_API_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$MILL_URL" ] && [ -n "$MILL_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # actions/setup-go v6.5.0
      - name: Setup Go
        if: steps.mill_env.outputs.enabled == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.0"
          cache: false

      # tailscale/github-action v4
      - name: Connect Tailscale (ephemeral CI node)
        if: steps.mill_env.outputs.enabled == 'true'
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install mill
        if: steps.mill_env.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/mill-bin"
          GOTOOLCHAIN=auto GOBIN="$RUNNER_TEMP/mill-bin" go install "github.com/autox-my/mill/cmd/mill@$MILL_REF"

      - name: Mark slice merged on mill
        if: steps.mill_env.outputs.enabled == 'true'
        continue-on-error: true
        env:
          MILL_URL: ${{ secrets.MILL_URL }}
          MILL_API_TOKEN: ${{ secrets.MILL_API_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          "$RUNNER_TEMP/mill-bin/mill" slice update \
            --branch "$PR_BRANCH" \
            --state merged \
            --verdict GREEN || true

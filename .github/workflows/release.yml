# Builds and publishes checksummed intentgate binaries when a human pushes a v* tag (ADR 0005, S-21).
# Nothing here creates a tag. The Action downloads these assets and verifies them against action/release.txt.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/intentgate_${TAG}_${os}_${arch}" ./cmd/intentgate
          done
          cd dist
          printf '%s\n' intentgate_* | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes dist/intentgate_* dist/SHA256SUMS
